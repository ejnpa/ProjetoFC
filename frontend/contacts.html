<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - exe.cuTIva</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <div class="logo">
            <img src="images/logo.png" alt="exe.cuTIva">
        </div>
        <nav class="menu" id="menu-principal">
            <a href="index.html">Página Inicial</a>
            <a href="contacts.html" class="ativo">Contactos</a>
            <a href="subjects.html">Explorar</a>
        </nav>
        <div class="topo-botoes" id="area-autenticacao"></div>
    </header>

    <section class="upload-container">
       <div class="upload-box box-contactos">
            <h2>Falar com a Equipa</h2>
            <p>Tens alguma dúvida, sugestão ou encontraste um problema? Envia-nos uma mensagem!</p>

            <form id="form-contacto">
                <label class="rotulo-form">Nome Completo</label>
                <input type="text" id="nome-contacto" name="nome" required>

                <label class="rotulo-form">Email de Contacto</label>
                <input type="email" id="email-contacto" name="email" required>

                <label class="rotulo-form">Assunto</label>
                <select name="assunto" required>
                    <option value="" disabled selected>Escolhe um assunto...</option>
                    <option value="Duvida">Dúvida sobre a plataforma</option>
                    <option value="Problema Técnico">Reportar um erro/problema técnico</option>
                    <option value="Sugestão">Ideia ou Sugestão</option>
                    <option value="Outro">Outro assunto</option>
                </select>

                <label class="rotulo-form">A tua mensagem</label>
                <textarea name="mensagem" rows="5" required></textarea>

                <button type="submit" class="btn-envio-contacto">
                    Enviar Mensagem
                </button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 exe.cuTIva - Plataforma de Partilha de Apontamentos Académicos</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacao();
            
            const nome = localStorage.getItem('utilizador_nome');
            if (nome) {
                document.getElementById('nome-contacto').value = nome;
            }

            document.getElementById('form-contacto').addEventListener('submit', (e) => {
                e.preventDefault();
                alert("Mensagem enviada com sucesso! Entraremos em contacto em breve.");
                window.location.href = 'index.html';
            });
        });

        function verificarAutenticacao() {
            const token = localStorage.getItem('token');
            const nome = localStorage.getItem('utilizador_nome');
            const areaAuth = document.getElementById('area-autenticacao');
            const menu = document.getElementById('menu-principal');

            if (token && nome) {
                menu.innerHTML = `
                    <a href="index.html">Página Inicial</a>
                    <a href="contacts.html" class="ativo">Contactos</a>
                    <a href="subjects.html">Explorar</a>
                    <a href="upload.html">Upload</a>
                    <a href="myNotes.html">Meus Apontamentos</a>
                `;
                areaAuth.innerHTML = `
                    <span style="margin-right: 15px;">Bem-vindo, <strong>${nome}</strong>!</span>
                    <a href="#" onclick="fazerLogout()" class="btn-login-topo">Sair</a>
                `;
            } else {
                menu.innerHTML = `
                    <a href="index.html">Página Inicial</a>
                    <a href="contacts.html" class="ativo">Contactos</a>
                    <a href="subjects.html">Explorar</a>
                `;
                areaAuth.innerHTML = `
                    <a href="registo.html" class="btn-topo">Registar</a>
                    <a href="login.html" class="btn-login-topo">Entrar</a>
                `;
            }
        }

        function fazerLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('utilizador_nome');
            window.location.reload();
        }
    </script>
</body>
</html>
