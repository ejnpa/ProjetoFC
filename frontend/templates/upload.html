<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - exe.cuTIve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <div class="logo">
            <img src="images/logo.png" alt="exe.cuTIve">
        </div>
        <nav class="menu" id="menu-principal">
            <a href="index.html">Página Inicial</a>
            <a href="contactos.html">Contactos</a>
            <a href="disciplinas.html">Explorar</a>
        </nav>
        <div class="topo-botoes" id="area-autenticacao"></div>
    </header>

    <section class="seccao-upload">
        <div class="container-upload">
            <div class="cabecalho-upload">
                <h1>Partilhar Apontamento</h1>
                <p>Faz upload do teu ficheiro para que fique disponível na nuvem.</p>
            </div>

            <form id="form-upload" class="formulario-upload">
                <div class="grupo-input">
                    <label for="titulo">Título do Apontamento</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Resumo de Redes - Capítulo 1" required>
                </div>

                <div class="grupo-input">
                    <label for="escola">Escola Superior</label>
                    <select id="escola" name="escola" required class="select-form">
                        <option value="" disabled selected>Seleciona a Escola...</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required disabled class="select-form">
                        <option value="" disabled selected>Primeiro seleciona uma escola...</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="ano">Ano Letivo</label>
                    <select id="ano" name="ano" required disabled class="select-form">
                        <option value="" disabled selected>Primeiro seleciona um curso...</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="disciplina">Disciplina</label>
                    <select id="disciplina" name="disciplina" required disabled class="select-form">
                        <option value="" disabled selected>Primeiro seleciona o ano letivo...</option>
                    </select>
                </div>

                <div class="grupo-input area-ficheiro">
                    <label for="ficheiro_pdf">Ficheiro (PDF)</label>
                    <input type="file" id="ficheiro_pdf" name="file" accept=".pdf, .png, .jpg, .docx, .txt, .xlsx, .pptx" required>
                </div>

                <button type="submit" class="btn-principal btn-upload" id="btn-submeter">Submeter Apontamento</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 exe.cuTIve - Plataforma de Partilha de Apontamentos Académicos</p>
    </footer>

    <script src="js/cascade.js"></script>
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacao();
        });

        function verificarAutenticacao() {
            const token = localStorage.getItem('token');
            const nome = localStorage.getItem('utilizador_nome');
            const areaAuth = document.getElementById('area-autenticacao');
            const menu = document.getElementById('menu-principal');

            if (!token) {
                alert("Precisas de fazer login para aceder ao upload!");
                window.location.href = 'login.html';
                return;
            }

            menu.innerHTML = `
                <a href="index.html">Página Inicial</a>
                <a href="contactos.html">Contactos</a>
                <a href="disciplinas.html">Explorar</a>
                <a href="upload.html" class="ativo">Upload</a>
                <a href="meusApontamentos.html">Meus Apontamentos</a>
            `;
            areaAuth.innerHTML = `
                <span style="margin-right: 15px;">Bem-vindo, <strong>${nome}</strong>!</span>
                <a href="#" onclick="fazerLogout()" class="btn-login-topo">Sair</a>
            `;
        }

        function fazerLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('utilizador_nome');
            window.location.href = 'index.html';
        }

        document.getElementById('form-upload').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const token = localStorage.getItem('token');
            const btn = document.getElementById('btn-submeter');
            btn.innerText = "A enviar para a Cloud...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('title', document.getElementById('titulo').value);
            formData.append('escola', document.getElementById('escola').value);
            formData.append('curso', document.getElementById('curso').value);
            formData.append('ano', document.getElementById('ano').value);
            formData.append('discipline', document.getElementById('disciplina').value);
            formData.append('file', document.getElementById('ficheiro_pdf').files[0]);

            try {
                const resposta = await fetch(`${API_BASE_URL}/notes/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (resposta.ok) {
                    alert("Apontamento enviado com sucesso!");
                    window.location.href = 'meusApontamentos.html';
                } else {
                    const erro = await resposta.json();
                    alert("Erro no upload: " + (erro.detail || "Erro desconhecido"));
                    btn.innerText = "Submeter Apontamento";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("Erro:", err);
                alert("Erro de comunicação com o servidor.");
                btn.innerText = "Submeter Apontamento";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
