<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - exe.cuTIve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-box">
        <h1>Registar</h1>

        <div id="mensagem-erro" style="color: red; font-size: 13px; margin-bottom: 10px;"></div>

        <form id="form-registo">
            <input type="text" id="nome" name="nome" placeholder="Nome Completo" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Palavra-Passe" required>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar Palavra-Passe" required>

            <button type="submit" class="btn-login">Criar Conta</button>
        </form>

        <p>Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
        <a href="index.html" class="btn-voltar">Voltar para a Página Inicial</a>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.getElementById('form-registo').addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const username = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const divErro = document.getElementById('mensagem-erro');
            divErro.innerText = "";

            if (password !== confirmPassword) {
                divErro.innerText = "As palavras-passe não coincidem.";
                return;
            }

            try {
                const resposta = await fetch(`${API_BASE_URL}/auth/registo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert("Conta criada com sucesso! Faça login.");
                    window.location.href = 'login.html';
                } else {
                    divErro.innerText = dados.detail || "Erro ao criar conta.";
                }
            } catch (erro) {
                console.error("Erro:", erro);
                divErro.innerText = "Erro ao comunicar com o servidor.";
            }
        });
    </script>
</body>
</html>
