<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - exe.cuTIve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-box">
        <h1>Login</h1>

        <div id="mensagem-erro" style="color: red; font-size: 13px; margin-bottom: 10px;"></div>

        <form id="form-login">
            <input type="email" id="email" name="email" placeholder="Email" required><br><br>
            <input type="password" id="password" name="password" placeholder="Palavra-passe" required><br><br>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p>Ainda não tem uma conta? <a href="registo.html">Faça registo aqui</a></p>
        <a href="index.html" class="btn-voltar">Voltar para a Página Inicial</a>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.getElementById('form-login').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const divErro = document.getElementById('mensagem-erro');
            divErro.innerText = "";

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const resposta = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    localStorage.setItem('token', dados.access_token);
                    localStorage.setItem('utilizador_nome', email.split('@')[0]);
                    window.location.href = 'index.html';
                } else {
                    divErro.innerText = dados.detail || "Email ou palavra-passe incorretos.";
                }
            } catch (erro) {
                console.error("Erro:", erro);
                divErro.innerText = "Erro ao comunicar com o servidor.";
            }
        });
    </script>
</body>
</html>
