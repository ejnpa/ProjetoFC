<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Apontamentos - exe.cuTIve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <div class="logo">
            <img src="images/logo.png" alt="exe.cuTIve">
        </div>
        <nav class="menu" id="menu-principal">
            <a href="index.html">Página Inicial</a>
            <a href="contacts.html">Contactos</a>
            <a href="subjects.html">Explorar</a>
        </nav>
        <div class="topo-botoes" id="area-autenticacao"></div>
    </header>

    <section class="lista-apontamentos">
        <div class="barra-topo-apontamentos">
            <h2>Os Meus Apontamentos</h2>
            <a href="upload.html" class="btn-principal">Adicionar Novo</a>
        </div>

        <div class="grelha-cards" id="grelha-meus-apontamentos">
            <p>A carregar os teus apontamentos...</p>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 exe.cuTIva - Plataforma de Partilha de Apontamentos Académicos</p>
    </footer>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacaoESeguir();
        });

        function verificarAutenticacaoESeguir() {
            const token = localStorage.getItem('token');
            const nome = localStorage.getItem('utilizador_nome');
            const areaAuth = document.getElementById('area-autenticacao');
            const menu = document.getElementById('menu-principal');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            menu.innerHTML = `
                <a href="index.html">Página Inicial</a>
                <a href="contacts.html">Contactos</a>
                <a href="subjects.html">Explorar</a>
                <a href="upload.html">Upload</a>
                <a href="myNotes.html" class="ativo">Meus Apontamentos</a>
            `;
            areaAuth.innerHTML = `
                <span style="margin-right: 15px;">Bem-vindo, <strong>${nome}</strong>!</span>
                <a href="#" onclick="fazerLogout()" class="btn-login-topo">Sair</a>
            `;

            carregarMeusApontamentos(token);
        }

        function fazerLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('utilizador_nome');
            window.location.reload();
        }

        async function carregarMeusApontamentos(token) {
            try {
                const resposta = await fetch(`${API_BASE_URL}/notes/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const apontamentos = await resposta.json();
                const grelha = document.getElementById('grelha-meus-apontamentos');
                grelha.innerHTML = '';

                if (apontamentos.length === 0) {
                    grelha.innerHTML = `
                        <div class="mensagem-vazia">
                            <p>Ainda não carregaste nenhum apontamento.</p>
                            <a href="upload.html">Começar agora →</a>
                        </div>
                    `;
                    return;
                }

                apontamentos.forEach(nota => {
                    const cartao = `
                        <div class="card-estudo">
                            <div class="capa">
                                <img src="${nota.thumbnail_url || 'https://via.placeholder.com/300x180?text=PDF'}" alt="Capa">
                            </div>
                            <div class="info">
                                <h3>${nota.title}</h3>
                                <span class="tag">${nota.discipline}</span>
                                <p class="autor">👤 ${nota.autor}</p>
                                <div class="acoes" style="display: flex; gap: 10px; margin-top: 10px;">
                                    <a href="${nota.file_url}" target="_blank" class="btn-ver" style="padding: 6px 12px;">Ver Ficheiro</a>
                                    <a href="leitor-inclusivo.html?id=${nota.id}" class="btn-ver" style="background-color: #FCC067; color: white; padding: 6px 12px;">🧠 Leitor Inclusivo</a>
                                    <button onclick="apagarNota('${nota.id}')" class="btn-ver" style="background: #ffcdd2; color: #b71c1c; border:none; cursor:pointer; padding: 6px 12px;">🗑️ Apagar</button>
                                </div>
                            </div>
                        </div>
                    `;
                    grelha.innerHTML += cartao;
                });
            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById('grelha-meus-apontamentos').innerHTML = `<p style="color:red;">Erro ao carregar os teus apontamentos.</p>`;
            }
        }

        async function apagarNota(id) {
            if (!confirm("Tens a certeza que pretendes apagar este apontamento?")) return;
            const token = localStorage.getItem('token');
            try {
                const resposta = await fetch(`${API_BASE_URL}/notes/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (resposta.ok) {
                    carregarMeusApontamentos(token);
                } else {
                    alert("Erro ao apagar apontamento.");
                }
            } catch (err) {
                console.error(err);
                alert("Erro de comunicação com o servidor.");
            }
        }
    </script>
</body>
</html>
