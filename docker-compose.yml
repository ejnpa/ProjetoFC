services:
  api:
    build: .
    container_name: executiva_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  web:
    image: nginx:alpine
    container_name: executiva_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api