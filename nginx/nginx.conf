events{
    # Número máximo de ligações simultâneas por worker
    worker_connections 1024;
}

http{
    # Mapeamento de tipos MIME essenciais para carregar CSS, JS e JSON corretamente
    include        /etc/nginx/mime.types;
    default_type   application/octet-stream; 

    # Otimizações de rede e I/O
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay    on;
    keepalive_timeout   65;

    # Compressão Gzip para carregamento rápido (crucial para acessibilidade e redes lentas)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;


    # Tamanho máximo de upload (essencial para permitir uploads de PDFs de apontamentos)
    client_max_body_size 50M;

    # Definição do backend FastAPI através da rede interna do Docker Compose
    upstream fastapi_backend{
        # 'api' corresponde exatamente ao nome do serviço definido no docker-compose.yml
        server api:8000;
        keepalive 32;
    }


    server{
        # Escuta na porta 80 padrão
        listen 80;
        listen [::]:80;

        # Responde a acessos locais, via IP Tailscale ou nomes MagicDNS
        server_name localhost 100.89.13.43 desktop;

        # Diretoria onde a pasta frontend/ é montada dentro do contentor Nginx
        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------
        # 1. Frontend: Ficheiros Estáticos (HTML, CSS, JS, Locales)
        # -------------------------------------------------------------

        location / {
            try_files $uri $uri/ /index.html;

            # Não colocar cache em HTML para garantir que o utilizador recebe sempre a versão mais recente
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache agressivo para assets estáticos estáveis (CSS, JS, imagens, ícones)
        location ~* \.(css|js|jpg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Ficheiros de internacionalização JSON (pt-PT.json, en.json)
        location /locales/ {
            expires 1d;
            add_header Cache-Control "public";

        }

        # -------------------------------------------------------------
        # 2. Backend: Encaminhamento de pedidos para a API FastAPI
        # -------------------------------------------------------------
        
        location /api/ {
            proxy_pass http://fastapi_backend;

            # Reencaminhamento de cabeçalhos de cliente e rede
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            # Otimização para Text-to-Speech (StreamingResponse) e processamento de IA:
            # Desativar o buffering permite que o áudio sintetizado comece a tocar imediatamente no cliente
            proxy_buffering off;


            # Timeouts alargados para acomodar o processamento de resumos e PDFs adaptados
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }


        # -------------------------------------------------------------
        # 3. Páginas de Erro Personalizadas
        # -------------------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

    }
}

